<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRISM Settings</title>
    <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
    <style>
      :root {
        --bg: #000000;
        --panel: #121212;
        --panel-strong: #1a1a1a;
        --line: rgba(255,255,255,0.18);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.72);
        --white: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .settings-wrap {
        width: min(860px, 100%);
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 1.25rem;
        padding: 2rem;
        box-shadow: 0 0 30px rgba(255,255,255,0.05);
      }

      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.18rem;
        text-transform: uppercase;
      }

      .home-link,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
        font-size: 0.8rem;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
      }

      .home-link:hover,
      .button:hover {
        background: var(--white);
        color: var(--bg);
      }

      .card-grid {
        display: grid;
        gap: 1rem;
      }

      .card {
        background: var(--panel-strong);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 1.25rem;
      }

      .card h2 {
        margin: 0 0 0.6rem;
        font-size: 0.9rem;
        letter-spacing: 0.15rem;
        text-transform: uppercase;
      }

      .card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 1rem;
      }

      .switch {
        position: relative;
        width: 52px;
        height: 30px;
        display: inline-block;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: #444;
        border-radius: 999px;
        transition: 0.2s ease;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        left: 4px;
        top: 4px;
        background: #fff;
        border-radius: 50%;
        transition: 0.2s ease;
      }

      .switch input:checked + .slider {
        background: #fff;
      }

      .switch input:checked + .slider::before {
        transform: translateX(22px);
        background: #000;
      }
    </style>
  </head>

  <body>
    <div class="settings-wrap">
      <div class="top-row">
        <h1>PRISM</h1>
        <a class="home-link" href="/">Home</a>
      </div>

      <div class="card-grid">
        <section class="card">
          <h2>Appearance</h2>
          <p>Current theme is black and white.</p>
          <div class="toggle-row">
            <span>Monochrome mode</span>
            <label class="switch" aria-label="Toggle monochrome mode">
              <input type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>Launch</h2>
          <p>Home is active by default. Other pages are intentionally blank for the first test.</p>
        </section>

        <section class="card">
          <h2>Quick actions</h2>
          <p>Use the primary navigation for future sections such as proxy, games, apps, chat, links, and profile.</p>
        </section>
      </div>
    </div>
  </body>
</html>
